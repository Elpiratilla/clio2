<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clío | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/clio-styles.css">
    <style>
        body {
            padding-top: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fondo);
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--fondo);
        }

        .left {
            width: 50%;
            background: var(--fondo-tarjeta);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            border-right: 1px solid rgba(255,255,255,0.08);
        }

        /*AJUSTE IMAGENES*/
        .left .logo-grande {
            width: 280px;
            height: 80px;
            object-fit: contain;
            object-position: center;
            margin-bottom: 20px;
            display: block;
        }

        .left h1 {
            font-size: 52px;
            margin-bottom: 20px;
            color: var(--texto-principal);
        }

        .left h1 span {
            color: var(--primario);
        }

        .left p {
            font-size: 18px;
            color: var(--texto-secundario);
            margin-bottom: 40px;
            text-align: center;
        }

        .left .ilustracion {
            width: 300px;
            height: 300px;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--fondo);
        }

        .form {
            width: 420px;
        }

        .form h2 {
            font-size: 60px;
            font-family: 'Segoe UI', 'Fredoka', system-ui, sans-serif;
            margin-bottom: 60px;
            color: var(--texto-principal);
        }

        .form label {
            display: block;
            margin-bottom: 10px;
            color: var(--texto-secundario);
            font-weight: 600;
        }

        .form input {
            width: 100%;
            height: 55px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--fondo-tarjeta);
            padding-left: 15px;
            font-size: 16px;
            color: var(--texto-principal);
            border-radius: 8px;
            transition: border 0.2s;
        }

        .form input:focus {
            border-color: var(--primario);
            outline: none;
        }

        .form input::placeholder {
            color: var(--texto-secundario);
        }

        .forgot {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot a {
            color: var(--primario);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 60px;
            border: none;
            background: var(--primario);
            color: var(--texto-principal);
            font-size: 30px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 40px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(124, 92, 255, 0.3);
        }

        .btn-submit:hover {
            background: var(--primario-claro);
            transform: scale(1.02);
        }

        .google {
            text-align: center;
            margin: 25px 0;
            color: var(--texto-secundario);
        }

        .google p {
            margin-bottom: 10px;
        }

        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .register {
            text-align: center;
            color: var(--texto-secundario);
        }

        .register a {
            color: var(--primario);
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1024px) {
            .login-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .left, .right {
                width: 100%;
                padding: 30px;
                border-right: none;
            }
            .left {
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }
            .left .logo-grande {
                width: 200px;
                height: 60px;
            }
            .left h1 {
                font-size: 36px;
            }
            .left .ilustracion {
                width: 200px;
                height: 200px;
            }
            .form h2 {
                font-size: 40px;
                margin-bottom: 30px;
            }
            body {
                overflow: auto;
            }
        }

        @media (max-width: 480px) {
            .form {
                width: 100%;
            }
            .left h1 {
                font-size: 28px;
            }
            .form h2 {
                font-size: 32px;
            }
            .left .logo-grande {
                width: 150px;
                height: 50px;
            }
            .left .ilustracion {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="left">
            <img src="../img/Clio verde. sin fondo.png" class="logo-grande" alt="Logo Clio">
            <h1>¡Bienvenido <span> otra vez!</span></h1>
            <p>Inicia sesión para continuar tu camino hacia un uso consciente de las redes sociales.</p>
            <img src="../img/Login. sin fondoo..png" class="ilustracion" alt="Ilustración">
        </div>

        <div class="right">
            <div class="form">
                <h2>Iniciar sesión</h2>
                <form id="loginForm">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="correo@gmail.com" required>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    <div class="forgot">
                    </div>
                    <button type="submit" id="btnLogin" class="btn-submit">Iniciar Sesión</button>
                </form>
                <hr>
                <div class="register">
                    ¿No tienes cuenta? <a href="register.html">Regístrate</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
